[project]
name = "it4r-mcp"
version = "0.1.0"
description = "A MCP server to work with EPFL ENAC IT4R"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.2.2",
]
dev = [
    "ruff>=0.10.0",
]

[project.scripts]
it4r-mcp = "it4r_mcp.server:main"

[project.urls]
Homepage = "https://www.epfl.ch/schools/enac/about/data-at-enac/enac-it4research/"
Repository = "https://github.com/EPFL-ENAC/it4r-mcp"
Documentation = "https://github.com/EPFL-ENAC/it4r-mcp"
"Bug Tracker" = "https://github.com/EPFL-ENAC/it4r-mcp/issues"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/it4r_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
